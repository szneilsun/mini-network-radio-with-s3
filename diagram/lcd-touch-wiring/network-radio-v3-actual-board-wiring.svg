<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 890" role="img" aria-labelledby="title desc">
  <title id="title">ESP32-S3 双 USB-C 开发板的网络收音机接线图</title>
  <desc id="desc">按实际两侧排针位置，连接 ST7735R 显示屏、MAX98357A 和三枚电容触摸电极。</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap');
    text{font-family:'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif}.title{fill:#f8fafc;font-size:20px;font-weight:700}.sub{fill:#94a3b8;font-size:10px}.name{fill:#f8fafc;font-size:13px;font-weight:700}.small{fill:#cbd5e1;font-size:10px;font-weight:500}.note{fill:#94a3b8;font-size:9px}.pin{fill:#e2e8f0;font-size:10px;font-weight:600}.cap{fill:#f8fafc;font-size:11px;font-weight:700}.region{fill:none;stroke:#334155;stroke-width:1;stroke-dasharray:7 4}.board{fill:rgba(6,78,59,.42);stroke:#34d399;stroke-width:1.6}.lcd{fill:rgba(76,29,149,.38);stroke:#a78bfa;stroke-width:1.6}.touch{fill:rgba(8,51,68,.42);stroke:#22d3ee;stroke-width:1.6}.amp{fill:rgba(6,78,59,.38);stroke:#34d399;stroke-width:1.6}.warn{fill:rgba(120,53,15,.27);stroke:#fbbf24;stroke-width:1.5}.ghost{fill:#475569;font-size:8px}.sig{fill:none;stroke:#a78bfa;stroke-width:2}.touchline{fill:none;stroke:#22d3ee;stroke-width:2}.audioline{fill:none;stroke:#34d399;stroke-width:2}.power{fill:none;stroke:#fb7185;stroke-width:2}.ground{fill:none;stroke:#94a3b8;stroke-width:1.6}
  </style>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern></defs>
  <rect width="1280" height="890" fill="#0f172a"/><rect width="1280" height="890" fill="url(#grid)"/>
  <text x="36" y="38" class="title">Network Radio 3.0.2 · 按实际 ESP32-S3 双 USB-C 开发板排针接线</text>
  <text x="36" y="59" class="sub">主板对应所附引脚图；仅标明本方案使用的排针。所有 LCD 信号及电源均为 3.3 V。</text>

  <!-- regions -->
  <rect x="35" y="98" width="340" height="480" rx="14" class="region"/><text x="52" y="120" fill="#a78bfa" font-size="10" font-weight="700">显示与音频模块</text>
  <rect x="890" y="98" width="350" height="420" rx="14" class="region"/><text x="907" y="120" fill="#22d3ee" font-size="10" font-weight="700">用户输入</text>

  <!-- wires behind components -->
  <path d="M490 165H412V150H375" class="power"/><text x="415" y="143" class="note">3V3 → VCC</text>
  <path d="M490 550H415V195H375" class="sig"/><text x="420" y="187" class="note">GPIO10 · CS</text>
  <path d="M490 580H430V230H375" class="sig"/><text x="435" y="222" class="note">GPIO11 · MOSI</text>
  <path d="M490 610H445V265H375" class="sig"/><text x="450" y="257" class="note">GPIO12 · SCLK · 1 MHz</text>
  <path d="M490 640H460V300H375" class="sig"/><text x="465" y="292" class="note">GPIO13 · BLK</text>
  <path d="M490 670H475V335H375" class="sig"/><text x="480" y="327" class="note">GPIO14 · DC</text>
  <path d="M490 310H400V370H375" class="sig"/><text x="403" y="363" class="note">GPIO15 · RST</text>
  <path d="M490 745H390V405H375" class="ground"/><text x="394" y="398" class="note">GND 共地</text>
  <path d="M490 190H350V650H250" class="audioline"/><text x="354" y="642" class="note">GPIO4 · BCLK</text>
  <path d="M490 220H365V680H250" class="audioline"/><text x="369" y="672" class="note">GPIO5 · LRCLK</text>
  <path d="M490 250H380V710H250" class="audioline"/><text x="384" y="702" class="note">GPIO6 · DIN</text>
  <path d="M730 250H820V180H890" class="touchline"/><text x="825" y="172" class="note">GPIO1 · 左键</text>
  <path d="M730 280H840V280H890" class="touchline"/><text x="844" y="272" class="note">GPIO2 · 中键</text>
  <path d="M490 430H400V800H860V380H890" class="touchline"/><text x="600" y="792" class="note">GPIO8 · 右键（从左侧排针绕至右侧）</text>

  <!-- LCD module -->
  <g>
    <rect x="72" y="138" width="303" height="300" rx="12" fill="#0f172a"/><rect x="72" y="138" width="303" height="300" rx="12" class="lcd"/>
    <text x="223" y="171" class="name" text-anchor="middle">ST7735R LCD 模块</text><text x="223" y="191" class="sub" text-anchor="middle">128 × 128 · SPI 1 MHz</text>
    <rect x="154" y="211" width="138" height="91" rx="5" fill="#111827" stroke="#a78bfa"/>
    <text x="223" y="252" fill="#f8fafc" font-size="16" font-weight="700" text-anchor="middle">TFT OK</text><rect x="257" y="266" width="10" height="10" fill="#34d399"/>
    <line x1="94" y1="322" x2="353" y2="322" stroke="#334155"/>
    <text x="95" y="348" class="pin">VCC</text><text x="352" y="348" class="small" text-anchor="end">3V3</text>
    <text x="95" y="368" class="pin">GND</text><text x="352" y="368" class="small" text-anchor="end">GND</text>
    <text x="95" y="388" class="pin">CS · SDA · SCL</text><text x="352" y="388" class="small" text-anchor="end">10 · 11 · 12</text>
    <text x="95" y="408" class="pin">BLK · DC · RST</text><text x="352" y="408" class="small" text-anchor="end">13 · 14 · 15</text>
    <text x="95" y="428" class="note">MISO 不接；背光默认为高电平点亮</text>
  </g>

  <!-- amp -->
  <g><rect x="70" y="618" width="180" height="112" rx="10" fill="#0f172a"/><rect x="70" y="618" width="180" height="112" rx="10" class="amp"/>
    <text x="160" y="650" class="name" text-anchor="middle">MAX98357A</text><text x="90" y="677" class="pin">BCLK</text><text x="227" y="677" class="small" text-anchor="end">GPIO4</text><text x="90" y="698" class="pin">LRC</text><text x="227" y="698" class="small" text-anchor="end">GPIO5</text><text x="90" y="719" class="pin">DIN</text><text x="227" y="719" class="small" text-anchor="end">GPIO6</text></g>

  <!-- exact board -->
  <g>
    <rect x="490" y="115" width="240" height="650" rx="17" fill="#0f172a"/><rect x="490" y="115" width="240" height="650" rx="17" class="board"/>
    <rect x="553" y="145" width="114" height="145" rx="8" fill="#475569" stroke="#94a3b8"/><path d="M568 153v13h15v-13h16v13h15v-13h16v13h15v-13h15" fill="none" stroke="#cbd5e1" stroke-width="3"/>
    <text x="610" y="322" class="name" text-anchor="middle">ESP32-S3</text><text x="610" y="341" class="small" text-anchor="middle">双 USB-C 开发板</text><text x="610" y="358" class="note" text-anchor="middle">与所附针脚图一致</text>
    <rect x="570" y="390" width="80" height="113" rx="6" fill="#1e293b" stroke="#64748b"/><text x="610" y="443" class="small" text-anchor="middle">USB-C</text><text x="610" y="461" class="note" text-anchor="middle">×2</text>
    <circle cx="610" cy="544" r="18" fill="#1e293b" stroke="#64748b"/><text x="610" y="548" class="note" text-anchor="middle">RGB</text>
    <!-- left header -->
    <text x="498" y="143" class="note">左侧排针（板顶向下）</text>
    <g fill="#f8fafc" stroke="#94a3b8"><circle cx="490" cy="165" r="4"/><circle cx="490" cy="190" r="4"/><circle cx="490" cy="220" r="4"/><circle cx="490" cy="250" r="4"/><circle cx="490" cy="280" r="4"/><circle cx="490" cy="310" r="4"/><circle cx="490" cy="340" r="4"/><circle cx="490" cy="370" r="4"/><circle cx="490" cy="400" r="4"/><circle cx="490" cy="430" r="4"/><circle cx="490" cy="460" r="4"/><circle cx="490" cy="490" r="4"/><circle cx="490" cy="520" r="4"/><circle cx="490" cy="550" r="4"/><circle cx="490" cy="580" r="4"/><circle cx="490" cy="610" r="4"/><circle cx="490" cy="640" r="4"/><circle cx="490" cy="670" r="4"/><circle cx="490" cy="700" r="4"/><circle cx="490" cy="745" r="4"/></g>
    <text x="501" y="169" class="pin">3V3</text><text x="501" y="194" class="pin">GPIO4</text><text x="501" y="224" class="pin">GPIO5</text><text x="501" y="254" class="pin">GPIO6</text><text x="501" y="284" class="ghost">GPIO7</text><text x="501" y="314" class="pin">GPIO15</text><text x="501" y="344" class="ghost">GPIO16</text><text x="501" y="374" class="ghost">GPIO17</text><text x="501" y="404" class="ghost">GPIO18</text><text x="501" y="434" class="pin">GPIO8</text><text x="501" y="464" class="ghost">GPIO3</text><text x="501" y="494" class="ghost">GPIO46</text><text x="501" y="524" class="ghost">GPIO9</text><text x="501" y="554" class="pin">GPIO10</text><text x="501" y="584" class="pin">GPIO11</text><text x="501" y="614" class="pin">GPIO12</text><text x="501" y="644" class="pin">GPIO13</text><text x="501" y="674" class="pin">GPIO14</text><text x="501" y="704" class="ghost">5V</text><text x="501" y="749" class="pin">GND</text>
    <!-- right header -->
    <text x="722" y="143" class="note" text-anchor="end">右侧排针（板顶向下）</text>
    <g fill="#f8fafc" stroke="#94a3b8"><circle cx="730" cy="165" r="4"/><circle cx="730" cy="190" r="4"/><circle cx="730" cy="220" r="4"/><circle cx="730" cy="250" r="4"/><circle cx="730" cy="280" r="4"/><circle cx="730" cy="310" r="4"/><circle cx="730" cy="340" r="4"/><circle cx="730" cy="370" r="4"/><circle cx="730" cy="400" r="4"/><circle cx="730" cy="430" r="4"/><circle cx="730" cy="460" r="4"/><circle cx="730" cy="490" r="4"/><circle cx="730" cy="520" r="4"/><circle cx="730" cy="550" r="4"/><circle cx="730" cy="580" r="4"/><circle cx="730" cy="610" r="4"/></g>
    <text x="719" y="169" class="ghost" text-anchor="end">GND</text><text x="719" y="194" class="ghost" text-anchor="end">GPIO43</text><text x="719" y="224" class="ghost" text-anchor="end">GPIO44</text><text x="719" y="254" class="pin" text-anchor="end">GPIO1</text><text x="719" y="284" class="pin" text-anchor="end">GPIO2</text><text x="719" y="314" class="ghost" text-anchor="end">GPIO42</text><text x="719" y="344" class="ghost" text-anchor="end">GPIO41</text><text x="719" y="374" class="ghost" text-anchor="end">GPIO40</text><text x="719" y="404" class="ghost" text-anchor="end">GPIO39</text><text x="719" y="434" class="ghost" text-anchor="end">GPIO38</text><text x="719" y="464" class="ghost" text-anchor="end">GPIO37</text><text x="719" y="494" class="ghost" text-anchor="end">GPIO36</text><text x="719" y="524" class="ghost" text-anchor="end">GPIO35</text><text x="719" y="554" class="ghost" text-anchor="end">GPIO0</text><text x="719" y="584" class="ghost" text-anchor="end">GPIO45</text><text x="719" y="614" class="ghost" text-anchor="end">GPIO48</text>
  </g>

  <!-- touch electrodes -->
  <g>
    <rect x="930" y="142" width="265" height="76" rx="10" fill="#0f172a"/><rect x="930" y="142" width="265" height="76" rx="10" class="touch"/><circle cx="968" cy="180" r="20" fill="rgba(34,211,238,.18)" stroke="#22d3ee" stroke-width="2"/><text x="1004" y="174" class="cap">触摸键 L</text><text x="1004" y="194" class="small">GPIO1 · 上一电台</text>
    <rect x="930" y="242" width="265" height="76" rx="10" fill="#0f172a"/><rect x="930" y="242" width="265" height="76" rx="10" class="touch"/><circle cx="968" cy="280" r="20" fill="rgba(34,211,238,.18)" stroke="#22d3ee" stroke-width="2"/><text x="1004" y="274" class="cap">触摸键 M</text><text x="1004" y="294" class="small">GPIO2 · 播放 / 停止</text>
    <rect x="930" y="342" width="265" height="76" rx="10" fill="#0f172a"/><rect x="930" y="342" width="265" height="76" rx="10" fill="rgba(8,51,68,.42)" stroke="#22d3ee" stroke-width="1.6"/><circle cx="968" cy="380" r="20" fill="rgba(34,211,238,.18)" stroke="#22d3ee" stroke-width="2"/><text x="1004" y="374" class="cap">触摸键 R</text><text x="1004" y="394" class="small">GPIO8 · 下一电台</text>
  </g>

  <rect x="890" y="560" width="350" height="165" rx="11" fill="#0f172a"/><rect x="890" y="560" width="350" height="165" rx="11" class="warn"/>
  <text x="912" y="590" fill="#fbbf24" font-size="12" font-weight="700">接线与装配注意</text>
  <text x="912" y="618" class="note">1. LCD VCC 接 3V3，不接板载 5V。</text><text x="912" y="640" class="note">2. LCD 的 MISO 不接；SPI 只用 MOSI/SCLK/CS。</text><text x="912" y="662" class="note">3. 三个电容电极不得互接或接地；间距 ≥ 5–8 mm。</text><text x="912" y="684" class="note">4. GPIO0、GPIO3、GPIO45、GPIO46 不用于外设。</text><text x="912" y="706" class="note">5. 背光若为低电平点亮，在固件中反转 GPIO13 极性。</text>

  <text x="36" y="852" class="sub">已避开：USB GPIO19/20、串口 GPIO43/44、启动相关 GPIO0/3/45/46、板载 RGB GPIO48；GPIO7 保留给未来 I²S 输入。</text>
</svg>
