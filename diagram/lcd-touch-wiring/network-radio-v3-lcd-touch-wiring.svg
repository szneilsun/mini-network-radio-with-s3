<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">Network Radio 3.0.2 LCD 与触摸按键接线图</title>
  <desc id="desc">ESP32-S3 连接 ST7735R 128乘128 显示屏、MAX98357A 音频功放和三枚电容触摸电极的引脚分配。</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
    .title { fill:#f8fafc; font-size:20px; font-weight:700; }
    .sub { fill:#94a3b8; font-size:10px; }
    .region { fill:none; stroke:#334155; stroke-width:1; stroke-dasharray:7 4; }
    .box { stroke-width:1.5; rx:10; }
    .name { fill:#f8fafc; font-size:13px; font-weight:700; }
    .small { fill:#cbd5e1; font-size:10px; font-weight:500; }
    .note { fill:#94a3b8; font-size:9px; }
    .pin { fill:#e2e8f0; font-size:10px; font-weight:600; }
    .label { fill:#cbd5e1; font-size:9px; }
    .line-cyan { stroke:#22d3ee; stroke-width:2; fill:none; }
    .line-green { stroke:#34d399; stroke-width:2; fill:none; }
    .line-violet { stroke:#a78bfa; stroke-width:2; fill:none; }
    .line-amber { stroke:#fbbf24; stroke-width:2; fill:none; }
    .line-slate { stroke:#94a3b8; stroke-width:1.6; fill:none; }
    .line-power { stroke:#fb7185; stroke-width:2; fill:none; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern>
  </defs>
  <rect width="1200" height="790" fill="#0f172a"/>
  <rect width="1200" height="790" fill="url(#grid)"/>

  <text x="36" y="38" class="title">Network Radio 3.0.2 · LCD + 3× 电容触摸按键</text>
  <text x="36" y="59" class="sub">ST7735R 128×128 · SPI 1 MHz · 不使用 microSD · 所有逻辑电平为 3.3 V</text>

  <!-- regions -->
  <rect x="38" y="92" width="315" height="386" rx="14" class="region"/>
  <text x="54" y="114" fill="#22d3ee" font-size="10" font-weight="700">用户输入</text>
  <rect x="840" y="92" width="320" height="440" rx="14" class="region"/>
  <text x="856" y="114" fill="#a78bfa" font-size="10" font-weight="700">显示输出</text>
  <rect x="305" y="683" width="590" height="75" rx="14" class="region"/>
  <text x="321" y="705" fill="#34d399" font-size="10" font-weight="700">音频输出（既有接线，保持不变）</text>

  <!-- connection lines behind components -->
  <path d="M353 190H460" class="line-cyan"/><text x="405" y="181" class="label" text-anchor="middle">GPIO1</text>
  <path d="M353 290H460" class="line-cyan"/><text x="405" y="281" class="label" text-anchor="middle">GPIO2</text>
  <path d="M353 390H460" class="line-cyan"/><text x="405" y="381" class="label" text-anchor="middle">GPIO8</text>
  <path d="M740 175H840" class="line-violet"/><text x="790" y="166" class="label" text-anchor="middle">GPIO10 · CS</text>
  <path d="M740 220H840" class="line-violet"/><text x="790" y="211" class="label" text-anchor="middle">GPIO11 · MOSI</text>
  <path d="M740 265H840" class="line-violet"/><text x="790" y="256" class="label" text-anchor="middle">GPIO12 · SCLK</text>
  <path d="M740 310H840" class="line-amber"/><text x="790" y="301" class="label" text-anchor="middle">GPIO13 · BLK</text>
  <path d="M740 355H840" class="line-violet"/><text x="790" y="346" class="label" text-anchor="middle">GPIO14 · DC</text>
  <path d="M740 400H840" class="line-violet"/><text x="790" y="391" class="label" text-anchor="middle">GPIO15 · RST</text>
  <path d="M525 670V683" class="line-green"/><text x="537" y="680" class="label">GPIO4 · BCLK</text>
  <path d="M600 670V683" class="line-green"/><text x="612" y="680" class="label">GPIO5 · LRCLK</text>
  <path d="M675 670V683" class="line-green"/><text x="687" y="680" class="label">GPIO6 · DIN</text>

  <!-- touch pads -->
  <g>
    <rect x="68" y="148" width="285" height="84" fill="#0f172a" rx="10"/>
    <rect x="68" y="148" width="285" height="84" class="box" fill="rgba(8,51,68,.45)" stroke="#22d3ee"/>
    <circle cx="105" cy="190" r="21" fill="none" stroke="#22d3ee" stroke-width="2"/><circle cx="105" cy="190" r="11" fill="rgba(34,211,238,.18)"/>
    <text x="142" y="181" class="name">触摸键 L</text><text x="142" y="200" class="small">上一电台 / GPIO1</text><text x="142" y="217" class="note">独立铜箔或金属电极</text>
  </g>
  <g>
    <rect x="68" y="248" width="285" height="84" fill="#0f172a" rx="10"/>
    <rect x="68" y="248" width="285" height="84" class="box" fill="rgba(8,51,68,.45)" stroke="#22d3ee"/>
    <circle cx="105" cy="290" r="21" fill="none" stroke="#22d3ee" stroke-width="2"/><circle cx="105" cy="290" r="11" fill="rgba(34,211,238,.18)"/>
    <text x="142" y="281" class="name">触摸键 M</text><text x="142" y="300" class="small">播放 / 停止 / GPIO2</text><text x="142" y="317" class="note">独立铜箔或金属电极</text>
  </g>
  <g>
    <rect x="68" y="348" width="285" height="84" fill="#0f172a" rx="10"/>
    <rect x="68" y="348" width="285" height="84" class="box" fill="rgba(8,51,68,.45)" stroke="#22d3ee"/>
    <circle cx="105" cy="390" r="21" fill="none" stroke="#22d3ee" stroke-width="2"/><circle cx="105" cy="390" r="11" fill="rgba(34,211,238,.18)"/>
    <text x="142" y="381" class="name">触摸键 R</text><text x="142" y="400" class="small">下一电台 / GPIO8</text><text x="142" y="417" class="note">独立铜箔或金属电极</text>
  </g>

  <!-- MCU -->
  <g>
    <rect x="460" y="118" width="280" height="552" fill="#0f172a" rx="12"/>
    <rect x="460" y="118" width="280" height="552" class="box" fill="rgba(6,78,59,.34)" stroke="#34d399"/>
    <text x="600" y="151" class="name" text-anchor="middle">ESP32-S3-WROOM-1-N16R8</text>
    <text x="600" y="171" class="sub" text-anchor="middle">Network Radio firmware 3.0.2</text>
    <line x1="482" y1="187" x2="718" y2="187" stroke="#334155"/>
    <text x="486" y="217" class="pin">GPIO1</text><text x="708" y="217" class="label" text-anchor="end">TOUCH L</text>
    <text x="486" y="247" class="pin">GPIO2</text><text x="708" y="247" class="label" text-anchor="end">TOUCH M</text>
    <text x="486" y="277" class="pin">GPIO8</text><text x="708" y="277" class="label" text-anchor="end">TOUCH R</text>
    <line x1="482" y1="295" x2="718" y2="295" stroke="#334155"/>
    <text x="486" y="327" class="pin">GPIO10</text><text x="708" y="327" class="label" text-anchor="end">TFT CS</text>
    <text x="486" y="357" class="pin">GPIO11</text><text x="708" y="357" class="label" text-anchor="end">TFT MOSI</text>
    <text x="486" y="387" class="pin">GPIO12</text><text x="708" y="387" class="label" text-anchor="end">TFT SCLK · 1 MHz</text>
    <text x="486" y="417" class="pin">GPIO13</text><text x="708" y="417" class="label" text-anchor="end">TFT BLK</text>
    <text x="486" y="447" class="pin">GPIO14</text><text x="708" y="447" class="label" text-anchor="end">TFT DC</text>
    <text x="486" y="477" class="pin">GPIO15</text><text x="708" y="477" class="label" text-anchor="end">TFT RST</text>
    <line x1="482" y1="495" x2="718" y2="495" stroke="#334155"/>
    <text x="486" y="527" class="pin">GPIO4</text><text x="708" y="527" class="label" text-anchor="end">I²S BCLK</text>
    <text x="486" y="557" class="pin">GPIO5</text><text x="708" y="557" class="label" text-anchor="end">I²S LRCLK</text>
    <text x="486" y="587" class="pin">GPIO6</text><text x="708" y="587" class="label" text-anchor="end">I²S DATA OUT</text>
    <line x1="482" y1="605" x2="718" y2="605" stroke="#334155"/>
    <text x="486" y="633" class="pin">GPIO48</text><text x="708" y="633" class="label" text-anchor="end">板载 WS2812 状态灯</text>
  </g>

  <!-- TFT -->
  <g>
    <rect x="840" y="138" width="280" height="350" fill="#0f172a" rx="12"/>
    <rect x="840" y="138" width="280" height="350" class="box" fill="rgba(76,29,149,.34)" stroke="#a78bfa"/>
    <text x="980" y="171" class="name" text-anchor="middle">ST7735R TFT</text>
    <text x="980" y="191" class="sub" text-anchor="middle">128 × 128 · SPI 1 MHz</text>
    <rect x="925" y="210" width="110" height="90" rx="5" fill="#111827" stroke="#a78bfa"/>
    <text x="980" y="254" fill="#f8fafc" font-size="16" font-weight="700" text-anchor="middle">TFT OK</text>
    <rect x="1006" y="266" width="11" height="11" fill="#34d399"/>
    <line x1="862" y1="323" x2="1098" y2="323" stroke="#334155"/>
    <text x="862" y="350" class="pin">CS</text><text x="1098" y="350" class="small" text-anchor="end">GPIO10</text>
    <text x="862" y="375" class="pin">SDA / MOSI</text><text x="1098" y="375" class="small" text-anchor="end">GPIO11</text>
    <text x="862" y="400" class="pin">SCL / SCLK</text><text x="1098" y="400" class="small" text-anchor="end">GPIO12</text>
    <text x="862" y="425" class="pin">BLK</text><text x="1098" y="425" class="small" text-anchor="end">GPIO13</text>
    <text x="862" y="450" class="pin">DC · RST</text><text x="1098" y="450" class="small" text-anchor="end">GPIO14 · GPIO15</text>
    <text x="862" y="473" class="note">MISO 不接；VCC 接 3V3，GND 共地</text>
  </g>

  <!-- amplifier -->
  <g>
    <rect x="385" y="710" width="410" height="35" fill="#0f172a" rx="8"/>
    <rect x="385" y="710" width="410" height="35" class="box" fill="rgba(6,78,59,.34)" stroke="#34d399"/>
    <text x="405" y="732" class="name">MAX98357A</text><text x="532" y="732" class="small">BCLK GPIO4 · LRC GPIO5 · DIN GPIO6</text><text x="770" y="732" class="note" text-anchor="end">扬声器 4–8Ω</text>
  </g>

  <!-- footer notes -->
  <rect x="38" y="555" width="315" height="138" fill="#0f172a" rx="10"/>
  <rect x="38" y="555" width="315" height="138" class="box" fill="rgba(120,53,15,.24)" stroke="#fbbf24"/>
  <text x="58" y="582" fill="#fbbf24" font-size="11" font-weight="700">布线注意</text>
  <text x="58" y="606" class="note">• LCD 与 ESP32 必须共地，VCC 用 3.3 V。</text>
  <text x="58" y="626" class="note">• 三块触摸面相距至少 5–8 mm，勿接 GND。</text>
  <text x="58" y="646" class="note">• 背光默认 GPIO13 高电平点亮；若反相，</text>
  <text x="58" y="663" class="note">  仅在固件中翻转背光极性常量。</text>
  <text x="58" y="683" class="note">• GPIO0 / 3 / 45 / 46 不作为本方案外设。</text>
</svg>
