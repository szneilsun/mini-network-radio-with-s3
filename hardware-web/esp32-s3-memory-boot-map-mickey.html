  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);

}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {

  height: auto;
}

#widget &gt; svg {

}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  flex: none;

.text-warning,
.text-destructive {

}

&lt;style&gt;
#esp32-s3-memory-boot-map {

  --viz-series-1: color-mix(in srgb, var(--red) 72%, var(--background));
  --viz-series-2: color-mix(in srgb, var(--yellow) 76%, var(--background));
  --viz-series-3: color-mix(in srgb, var(--foreground) 72%, var(--background));
  --viz-series-4: color-mix(in srgb, var(--red) 52%, var(--yellow));
  --viz-series-5: color-mix(in srgb, var(--yellow) 48%, var(--background));
  --viz-series-6: color-mix(in srgb, var(--foreground) 44%, var(--background));
  --rom: var(--viz-series-1);
  --sram: var(--viz-series-2);
  --flash: var(--viz-series-3);

  &lt;section aria-labelledby=&quot;boot-title&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;

        &lt;div class=&quot;section-kicker text-small&quot;&gt;&lt;i data-lucide=&quot;git-branch&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; 启动顺序&lt;/div&gt;
        &lt;h2 id=&quot;boot-title&quot;&gt;从复位向量到 Arduino &lt;code&gt;loop()&lt;/code&gt;&lt;/h2&gt;
      &lt;/div&gt;
      &lt;p class=&quot;text-muted text-small&quot;&gt;以下为分区偏移正确时的正常路径；地址来自 ROM 入口、Bootloader ELF 与应用 ELF 符号。&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;boot-flow&quot; role=&quot;img&quot; aria-label=&quot;ESP32-S3 双核启动流程，从 ROM reset 到 bootloader、应用入口、FreeRTOS 任务和 Arduino setup loop&quot;&gt;
      &lt;div class=&quot;boot-header text-small&quot;&gt;
        &lt;span&gt;&lt;/span&gt;&lt;span class=&quot;lane-title&quot;&gt;阶段&lt;/span&gt;&lt;span class=&quot;lane-title&quot;&gt;共享 / CPU0 主链&lt;/span&gt;&lt;span class=&quot;lane-title&quot;&gt;CPU1 分支&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;boot-step&quot;&gt;
        &lt;span class=&quot;step-index&quot;&gt;01&lt;/span&gt;&lt;span class=&quot;step-phase&quot;&gt;上电复位&lt;/span&gt;
        &lt;div class=&quot;lane-node cpu0&quot;&gt;&lt;span class=&quot;mobile-lane text-small&quot;&gt;CPU0&lt;/span&gt;&lt;strong&gt;CPU0 执行 Mask ROM Reset&lt;/strong&gt;&lt;span&gt;&lt;code&gt;0x40000400&lt;/code&gt; → 读取 Flash 启动头&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;lane-empty&quot;&gt;reset / stall&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;boot-step&quot;&gt;
        &lt;span class=&quot;step-index&quot;&gt;02&lt;/span&gt;&lt;span class=&quot;step-phase&quot;&gt;二级引导&lt;/span&gt;
        &lt;div class=&quot;lane-node cpu0&quot;&gt;&lt;span class=&quot;mobile-lane text-small&quot;&gt;CPU0&lt;/span&gt;&lt;strong&gt;Flash &lt;code&gt;0x000000&lt;/code&gt; → 内部 SRAM&lt;/strong&gt;&lt;span&gt;装入 1 个 DRAM 段 + 2 个 IRAM 段&lt;/span&gt;&lt;span&gt;&lt;code&gt;call_start_cpu0 @ 0x403C88B8&lt;/code&gt; → &lt;code&gt;bootloader_init @ 0x403C8928&lt;/code&gt;&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;lane-empty&quot;&gt;reset / stall&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;boot-step&quot;&gt;
        &lt;span class=&quot;step-index&quot;&gt;03&lt;/span&gt;&lt;span class=&quot;step-phase&quot;&gt;选择分区&lt;/span&gt;
        &lt;div class=&quot;lane-node cpu0&quot;&gt;&lt;span class=&quot;mobile-lane text-small&quot;&gt;CPU0&lt;/span&gt;&lt;strong&gt;解析 Flash 元数据&lt;/strong&gt;&lt;span&gt;table &lt;code&gt;0x008000&lt;/code&gt; → otadata &lt;code&gt;0x019000&lt;/code&gt; → 选定 app0 &lt;code&gt;0x20000&lt;/code&gt; 或 app1 &lt;code&gt;0x320000&lt;/code&gt;&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;lane-empty&quot;&gt;reset / stall&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;boot-step&quot;&gt;
        &lt;span class=&quot;step-index&quot;&gt;04&lt;/span&gt;&lt;span class=&quot;step-phase&quot;&gt;装入镜像&lt;/span&gt;
        &lt;div class=&quot;lane-node cpu0&quot;&gt;&lt;span class=&quot;mobile-lane text-small&quot;&gt;CPU0&lt;/span&gt;&lt;strong&gt;&lt;code&gt;bootloader_utility_load_boot_image @ 0x403CD0EC&lt;/code&gt;&lt;/strong&gt;&lt;span&gt;内部 &lt;code&gt;load_image @ 0x403CCC7C&lt;/code&gt;：校验、复制 IRAM/DRAM/RTC、映射 IROM/DROM&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;lane-empty&quot;&gt;reset / stall&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;boot-step&quot;&gt;
        &lt;span class=&quot;step-index&quot;&gt;05&lt;/span&gt;&lt;span class=&quot;step-phase&quot;&gt;切入应用&lt;/span&gt;
        &lt;div class=&quot;lane-node cpu0&quot;&gt;&lt;span class=&quot;mobile-lane text-small&quot;&gt;CPU0&lt;/span&gt;&lt;strong&gt;间接跳转 → 应用入口&lt;/strong&gt;&lt;span&gt;&lt;code&gt;call_start_cpu0 @ 0x40375D98&lt;/code&gt; → &lt;code&gt;system_early_init @ 0x420B4C84&lt;/code&gt;&lt;/span&gt;&lt;span&gt;清 BSS，初始化 cache / RTC / MSPI / PSRAM&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;lane-empty&quot;&gt;reset / stall&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;boot-step&quot;&gt;
        &lt;span class=&quot;step-index&quot;&gt;06&lt;/span&gt;&lt;span class=&quot;step-phase&quot;&gt;启动 CPU1&lt;/span&gt;
        &lt;div class=&quot;lane-node cpu0&quot;&gt;&lt;span class=&quot;mobile-lane text-small&quot;&gt;CPU0&lt;/span&gt;&lt;strong&gt;设置 APP CPU 启动入口并释放 CPU1&lt;/strong&gt;&lt;span&gt;随后通过 &lt;code&gt;g_startup_fn[0]&lt;/code&gt; 进入 CPU0 初始化&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;lane-node cpu1&quot;&gt;&lt;span class=&quot;mobile-lane text-small&quot;&gt;CPU1&lt;/span&gt;&lt;strong&gt;&lt;code&gt;call_start_cpu1 @ 0x40375CA8&lt;/code&gt;&lt;/strong&gt;&lt;span&gt;完成 &lt;code&gt;bootloader_init_mem&lt;/code&gt;、中断与 cache-error 基础设置，等待 &lt;code&gt;s_resume_cores&lt;/code&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;boot-step&quot;&gt;
        &lt;span class=&quot;step-index&quot;&gt;07&lt;/span&gt;&lt;span class=&quot;step-phase&quot;&gt;每核初始化&lt;/span&gt;
        &lt;div class=&quot;lane-node cpu0&quot;&gt;&lt;span class=&quot;mobile-lane text-small&quot;&gt;CPU0&lt;/span&gt;&lt;strong&gt;&lt;code&gt;start_cpu0 @ 0x420B5B18&lt;/code&gt;&lt;/strong&gt;&lt;span&gt;CORE 初始化 + 全局构造 → &lt;code&gt;startup_resume_other_cores @ 0x420B4EF8&lt;/code&gt;&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;lane-node cpu1&quot;&gt;&lt;span class=&quot;mobile-lane text-small&quot;&gt;CPU1&lt;/span&gt;&lt;strong&gt;等待 CPU0 放行&lt;/strong&gt;&lt;span&gt;尚未进入 secondary init&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;boot-step&quot;&gt;
        &lt;span class=&quot;step-index&quot;&gt;08&lt;/span&gt;&lt;span class=&quot;step-phase&quot;&gt;双核汇合&lt;/span&gt;
        &lt;div class=&quot;lane-node cpu0&quot;&gt;&lt;span class=&quot;mobile-lane text-small&quot;&gt;CPU0&lt;/span&gt;&lt;strong&gt;放行并等待 barrier&lt;/strong&gt;&lt;span&gt;两核完成 SECONDARY init&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;lane-node cpu1&quot;&gt;&lt;span class=&quot;mobile-lane text-small&quot;&gt;CPU1&lt;/span&gt;&lt;strong&gt;&lt;code&gt;g_startup_fn[1]&lt;/code&gt; → &lt;code&gt;start_cpu_other_cores @ 0x403762DC&lt;/code&gt;&lt;/strong&gt;&lt;span&gt;执行 CPU1 secondary init&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;boot-step&quot;&gt;
        &lt;span class=&quot;step-index&quot;&gt;09&lt;/span&gt;&lt;span class=&quot;step-phase&quot;&gt;调度器&lt;/span&gt;
        &lt;div class=&quot;lane-node cpu0&quot;&gt;&lt;span class=&quot;mobile-lane text-small&quot;&gt;CPU0&lt;/span&gt;&lt;strong&gt;&lt;code&gt;esp_startup_start_app @ 0x42173698&lt;/code&gt;&lt;/strong&gt;&lt;span&gt;启动 CPU0 FreeRTOS scheduler&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;lane-node cpu1&quot;&gt;&lt;span class=&quot;mobile-lane text-small&quot;&gt;CPU1&lt;/span&gt;&lt;strong&gt;&lt;code&gt;esp_startup_start_app_other_cores @ 0x421736F0&lt;/code&gt;&lt;/strong&gt;&lt;span&gt;启动 CPU1 FreeRTOS scheduler&lt;/span&gt;&lt;/div&gt;

  &lt;section class=&quot;card risk-card&quot; role=&quot;alert&quot; aria-labelledby=&quot;risk-title&quot;&gt;
    &lt;div class=&quot;risk-heading&quot;&gt;&lt;i data-lucide=&quot;triangle-alert&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;h2 id=&quot;risk-title&quot;&gt;当前 merged.bin 无法按自定义分区表正常启动&lt;/h2&gt;&lt;/div&gt;
    &lt;div class=&quot;offset-compare&quot;&gt;

        &lt;div class=&quot;offset-sequence&quot;&gt;&lt;code&gt;bootloader@0x000000&lt;/code&gt;&lt;span&gt;→&lt;/span&gt;&lt;code&gt;table@0x008000&lt;/code&gt;&lt;span&gt;→&lt;/span&gt;&lt;code&gt;boot_app0@0x019000&lt;/code&gt;&lt;span&gt;→&lt;/span&gt;&lt;code&gt;app0@0x20000&lt;/code&gt;&lt;span&gt;→&lt;/span&gt;&lt;code&gt;LittleFS@0x620000&lt;/code&gt;&lt;/div&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;esp32-s3-memory-boot-map&#x27;);
  if (!root) return;

  const buttons = [...root.querySelectorAll(&#x27;[data-slot-base]&#x27;)];
  const rows = [...root.querySelectorAll(&#x27;.image-segment[data-offset]&#x27;)];
  const status = root.querySelector(&#x27;#segment-status&#x27;);

  const formatHex = (value) =&gt; `0x${value.toString(16).toUpperCase()}`;

  const selectSlot = (button) =&gt; {
    const base = Number(button.dataset.slotBase);
    const label = button.textContent.trim();

    buttons.forEach((candidate) =&gt; {
      candidate.setAttribute(&#x27;aria-pressed&#x27;, String(candidate === button));
    });

    rows.forEach((row) =&gt; {
      const source = row.querySelector(&#x27;.seg-source&#x27;);
      const offset = Number(row.dataset.offset);
      if (source) source.textContent = formatHex(base + offset);
    });

    if (status) {
      status.innerHTML = `当前显示 ${label}，P = &lt;code&gt;${formatHex(base)}&lt;/code&gt;；目标运行地址不随 OTA 槽变化。`;
    }
  };

  buttons.forEach((button) =&gt; {
    button.addEventListener(&#x27;click&#x27;, () =&gt; selectSlot(button));
  });
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
